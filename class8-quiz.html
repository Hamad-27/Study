<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyZone | Class 8 Quiz</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {
    font-family: Arial, Helvetica, sans-serif;

    min-height: 100vh;

    color: white;

    background:
        radial-gradient(circle at 10% 10%, rgba(0, 200, 255, .18), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(130, 70, 255, .20), transparent 30%),
        #070b17;

    padding: 20px;

    overflow-x: hidden;
}


/* =========================
   BACKGROUND LIGHTS
========================= */

.background-light {
    position: fixed;

    width: 250px;
    height: 250px;

    border-radius: 50%;

    filter: blur(90px);

    opacity: .18;

    pointer-events: none;
}

.light-one {
    background: #00d9ff;

    top: -80px;
    left: -80px;
}

.light-two {
    background: #8b5cff;

    bottom: -100px;
    right: -80px;
}


/* =========================
   MAIN CONTAINER
========================= */

.quiz-container {

    position: relative;

    max-width: 850px;

    margin: 30px auto;

    padding: 30px;

    border-radius: 30px;

    background: rgba(255,255,255,.07);

    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.45);

}


/* =========================
   HEADER
========================= */

.quiz-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}


.logo {

    font-size: 25px;

    font-weight: 900;
}


.logo span {

    color: #59e7ff;
}


.class-badge {

    padding: 9px 15px;

    border-radius: 30px;

    background: rgba(89,231,255,.12);

    border: 1px solid rgba(89,231,255,.25);

    color: #59e7ff;

    font-weight: bold;

    font-size: 14px;
}


/* =========================
   TITLE
========================= */

.title {

    text-align: center;

    margin-bottom: 8px;

    font-size: 32px;

    font-weight: 900;
}


.subtitle {

    text-align: center;

    color: rgba(255,255,255,.55);

    margin-bottom: 30px;
}


/* =========================
   QUIZ TOP BAR
========================= */

.quiz-info {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 10px;

    font-size: 14px;

    color: rgba(255,255,255,.7);
}


.score {

    color: #59e7ff;

    font-weight: bold;
}


/* =========================
   PROGRESS
========================= */

.progress-background {

    width: 100%;

    height: 9px;

    background: rgba(255,255,255,.08);

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 30px;
}


.progress-bar {

    height: 100%;

    width: 0%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #59e7ff,
            #805cff
        );

    transition: width .4s ease;
}


/* =========================
   QUESTION CARD
========================= */

.question-card {

    padding: 30px;

    border-radius: 24px;

    background: rgba(0,0,0,.18);

    border: 1px solid rgba(255,255,255,.08);

    margin-bottom: 25px;
}


.question-number {

    color: #59e7ff;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 12px;
}


.question {

    font-size: 23px;

    line-height: 1.45;

    font-weight: 800;
}


/* =========================
   OPTIONS
========================= */

.options {

    display: grid;

    gap: 13px;

    margin-top: 25px;
}


.option {

    width: 100%;

    padding: 17px;

    border-radius: 16px;

    border: 1px solid rgba(255,255,255,.12);

    background: rgba(255,255,255,.045);

    color: white;

    text-align: left;

    font-size: 16px;

    cursor: pointer;

    transition:
        transform .2s,
        background .2s,
        border .2s;
}


.option:hover {

    transform: translateY(-2px);

    background: rgba(255,255,255,.09);

    border-color: rgba(89,231,255,.5);
}


.option.correct {

    background: rgba(30, 200, 120, .18);

    border-color: #32e69b;

}


.option.wrong {

    background: rgba(255, 70, 90, .18);

    border-color: #ff5969;
}


.option:disabled {

    cursor: default;
}


/* =========================
   NEXT BUTTON
========================= */

.next-button {

    width: 100%;

    padding: 17px;

    border: none;

    border-radius: 17px;

    background:
        linear-gradient(
            90deg,
            #59e7ff,
            #765cff
        );

    color: white;

    font-size: 17px;

    font-weight: 800;

    cursor: pointer;

    transition: transform .2s, box-shadow .2s;
}


.next-button:hover {

    transform: translateY(-3px);

    box-shadow:
        0 12px 30px rgba(89,231,255,.18);
}


/* =========================
   RESULT SCREEN
========================= */

.result {

    display: none;

    text-align: center;

    padding: 30px 10px;
}


.trophy {

    font-size: 75px;

    animation: trophyFloat 2s infinite ease-in-out;
}


@keyframes trophyFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}


.result h2 {

    font-size: 34px;

    margin: 15px 0;
}


.final-score {

    font-size: 55px;

    font-weight: 900;

    color: #59e7ff;

    margin: 15px;
}


.result-message {

    color: rgba(255,255,255,.65);

    margin-bottom: 25px;
}


.restart-button {

    border: none;

    padding: 15px 30px;

    border-radius: 15px;

    background:
        linear-gradient(
            90deg,
            #59e7ff,
            #765cff
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   FOOTER
========================= */

.footer {

    text-align: center;

    margin-top: 25px;

    color: rgba(255,255,255,.35);

    font-size: 12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    body {
        padding: 10px;
    }

    .quiz-container {
        padding: 20px;

        margin: 10px auto;

        border-radius: 23px;
    }

    .title {
        font-size: 27px;
    }

    .question-card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }

    .quiz-header {
        align-items: flex-start;
    }

    .logo {
        font-size: 21px;
    }

}

</style>
</head>


<body>

<div class="background-light light-one"></div>
<div class="background-light light-two"></div>


<div class="quiz-container">


    <!-- HEADER -->

    <div class="quiz-header">

        <div class="logo">
            📚 <span>StudyZone</span>
        </div>

        <div class="class-badge">
            🎓 Class 8
        </div>

    </div>


    <!-- TITLE -->

    <h1 class="title">
        🧠 Class 8 Quiz
    </h1>

    <p class="subtitle">
        Test your knowledge and challenge yourself!
    </p>


    <!-- QUIZ AREA -->

    <div id="quizArea">

        <div class="quiz-info">

            <span id="questionCounter">
                Question 1 of 20
            </span>

            <span class="score">
                ⭐ Score: <span id="score">0</span>
            </span>

        </div>


        <div class="progress-background">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>


        <div class="question-card">

            <div
                class="question-number"
                id="questionNumber">
                QUESTION 1
            </div>

            <div
                class="question"
                id="question">
            </div>

            <div
                class="options"
                id="options">
            </div>

        </div>


        <button
            class="next-button"
            id="nextButton"
            onclick="nextQuestion()"
            style="display:none;">

            Next Question →
        </button>

    </div>


    <!-- RESULT -->

    <div
        class="result"
        id="result">

        <div class="trophy">
            🏆
        </div>

        <h2>
            Quiz Completed!
        </h2>

        <p>
            Your final score
        </p>

        <div
            class="final-score"
            id="finalScore">
            0 / 20
        </div>

        <p
            class="result-message"
            id="resultMessage">
        </p>

        <button
            class="restart-button"
            onclick="restartQuiz()">

            🔄 Try Again

        </button>

    </div>


    <div class="footer">
        © 2026 StudyZone • Keep learning 🚀
    </div>

</div>


<script>

/* ==========================================
   CLASS 8 QUESTION BANK
========================================== */

const questions = [

    {
        question: "What is the value of 3/4 + 1/8?",
        options: [
            "7/8",
            "5/8",
            "3/8",
            "1"
        ],
        answer: 0
    },

    {
        question: "Which number is a perfect square?",
        options: [
            "48",
            "64",
            "72",
            "90"
        ],
        answer: 1
    },

    {
        question: "If x + 7 = 15, what is the value of x?",
        options: [
            "6",
            "7",
            "8",
            "9"
        ],
        answer: 2
    },

    {
        question: "What is the cube of 4?",
        options: [
            "12",
            "16",
            "32",
            "64"
        ],
        answer: 3
    },

    {
        question: "Which tissue carries water and minerals from the roots to other parts of a plant?",
        options: [
            "Xylem",
            "Phloem",
            "Stomata",
            "Petal"
        ],
        answer: 0
    },

    {
        question: "Which organ pumps blood throughout the human body?",
        options: [
            "Lungs",
            "Heart",
            "Kidney",
            "Stomach"
        ],
        answer: 1
    },

    {
        question: "Which force pulls objects toward the Earth?",
        options: [
            "Friction",
            "Magnetic force",
            "Gravitational force",
            "Muscular force"
        ],
        answer: 2
    },

    {
        question: "Which microorganism is commonly used to make bread rise?",
        options: [
            "Yeast",
            "Algae",
            "Protozoa",
            "Virus"
        ],
        answer: 0
    },

    {
        question: "Which gas is necessary for humans to carry out aerobic respiration?",
        options: [
            "Nitrogen",
            "Oxygen",
            "Carbon dioxide",
            "Hydrogen"
        ],
        answer: 1
    },

    {
        question: "What is the process by which green plants make food using sunlight?",
        options: [
            "Respiration",
            "Digestion",
            "Photosynthesis",
            "Transpiration"
        ],
        answer: 2
    },

    {
        question: "What is the main purpose of a constitution in a democratic country?",
        options: [
            "To define the basic rules and principles of government",
            "To provide daily weather forecasts",
            "To replace all laws every year",
            "To control the Earth's climate"
        ],
        answer: 0
    },

    {
        question: "Which branch of government generally makes laws?",
        options: [
            "Legislature",
            "Judiciary",
            "Executive",
            "Election commission"
        ],
        answer: 0
    },

    {
        question: "Which type of resource can be naturally replenished over a relatively short period?",
        options: [
            "Renewable resource",
            "Non-renewable resource",
            "Mineral ore",
            "Fossil fuel"
        ],
        answer: 0
    },

    {
        question: "Which economic sector includes activities such as farming and fishing?",
        options: [
            "Primary sector",
            "Secondary sector",
            "Tertiary sector",
            "Information sector"
        ],
        answer: 0
    },

    {
        question: "Choose the correct plural form of the word 'child'.",
        options: [
            "Childs",
            "Childes",
            "Children",
            "Childrens"
        ],
        answer: 2
    },

    {
        question: "Which word is an adjective in the sentence: 'The bright sun warmed the room'?",
        options: [
            "The",
            "Bright",
            "Sun",
            "Warmed"
        ],
        answer: 1
    },

    {
        question: "What is the perimeter of a square with a side length of 6 cm?",
        options: [
            "12 cm",
            "18 cm",
            "24 cm",
            "36 cm"
        ],
        answer: 2
    },

    {
        question: "Which is the largest planet in our Solar System?",
        options: [
            "Earth",
            "Jupiter",
            "Saturn",
            "Neptune"
        ],
        answer: 1
    },

    {
        question: "Which instrument is used to measure temperature?",
        options: [
            "Barometer",
            "Thermometer",
            "Ammeter",
            "Speedometer"
        ],
        answer: 1
    },

    {
        question: "What is 15% of 200?",
        options: [
            "15",
            "20",
            "30",
            "40"
        ],
        answer: 2
    }

];


/* ==========================================
   VARIABLES
========================================== */

let currentQuestion = 0;

let score = 0;

let answered = false;


/* ==========================================
   ELEMENTS
========================================== */

const questionElement =
    document.getElementById("question");

const optionsElement =
    document.getElementById("options");

const questionNumberElement =
    document.getElementById("questionNumber");

const questionCounterElement =
    document.getElementById("questionCounter");

const scoreElement =
    document.getElementById("score");

const progressBar =
    document.getElementById("progressBar");

const nextButton =
    document.getElementById("nextButton");

const quizArea =
    document.getElementById("quizArea");

const result =
    document.getElementById("result");

const finalScore =
    document.getElementById("finalScore");

const resultMessage =
    document.getElementById("resultMessage");


/* ==========================================
   LOAD QUESTION
========================================== */

function loadQuestion() {

    answered = false;

    nextButton.style.display = "none";

    const q = questions[currentQuestion];


    questionElement.textContent =
        q.question;


    questionNumberElement.textContent =
        "QUESTION " + (currentQuestion + 1);


    questionCounterElement.textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    progressBar.style.width =
        ((currentQuestion + 1) /
        questions.length * 100) + "%";


    optionsElement.innerHTML = "";


    q.options.forEach(function(option, index) {

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            option;

        button.onclick = function() {

            selectAnswer(index, button);

        };

        optionsElement.appendChild(button);

    });

}


/* ==========================================
   SELECT ANSWER
========================================== */

function selectAnswer(selectedIndex, selectedButton) {

    if (answered) {
        return;
    }

    answered = true;


    const correctIndex =
        questions[currentQuestion].answer;


    const allOptions =
        document.querySelectorAll(".option");


    allOptions.forEach(function(button) {

        button.disabled = true;

    });


    if (selectedIndex === correctIndex) {

        selectedButton.classList.add("correct");

        score++;

        scoreElement.textContent =
            score;

    } else {

        selectedButton.classList.add("wrong");

        allOptions[correctIndex]
            .classList.add("correct");

    }


    nextButton.style.display = "block";


    if (currentQuestion === questions.length - 1) {

        nextButton.textContent =
            "🏆 See My Result";

    }

}


/* ==========================================
   NEXT QUESTION
========================================== */

function nextQuestion() {

    currentQuestion++;


    if (currentQuestion >= questions.length) {

        showResult();

        return;

    }


    loadQuestion();

}


/* ==========================================
   SHOW RESULT
========================================== */

function showResult() {

    quizArea.style.display = "none";

    result.style.display = "block";


    finalScore.textContent =
        score + " / " + questions.length;


    const percentage =
        (score / questions.length) * 100;


    if (percentage === 100) {

        resultMessage.textContent =
            "🌟 Perfect score! Amazing work!";

    }

    else if (percentage >= 80) {

        resultMessage.textContent =
            "🔥 Excellent! You really know your stuff!";

    }

    else if (percentage >= 60) {

        resultMessage.textContent =
            "👏 Great job! Keep practicing!";

    }

    else if (percentage >= 40) {

        resultMessage.textContent =
            "💪 Good effort! A little more practice will help.";

    }

    else {

        resultMessage.textContent =
            "📚 Keep studying and try the quiz again!";

    }

}


/* ==========================================
   RESTART
========================================== */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    answered = false;


    scoreElement.textContent = "0";


    result.style.display = "none";

    quizArea.style.display = "block";


    nextButton.textContent =
        "Next Question →";


    loadQuestion();

}


/* ==========================================
   START QUIZ
========================================== */

loadQuestion();

</script>

</body>
</html>
